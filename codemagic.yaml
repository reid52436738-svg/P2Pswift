workflows:
  build_ios_app:
    name: Build iOS App from SwiftPM iOSApplication
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.2
    scripts:
      - name: Generate Xcode workspace from Swift Package
        script: |
          xcodebuild -create-xcworkspace -package . -output app.xcworkspace
      - name: Build unsigned IPA
        script: |
          xcodebuild archive \
            -workspace app.xcworkspace \
            -scheme MyApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/MyApp.xcarchive
          xcodebuild -exportArchive \
            -archivePath build/MyApp.xcarchive \
            -exportPath build/Output \
            -exportOptionsPlist exportOptions.plist
    artifacts:
      - build/Output/*.ipa
