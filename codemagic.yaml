workflows:
  build_ios:
    name: Build iOS IPA from SwiftPM
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.0
    scripts:
      - name: Generate Xcode workspace from SwiftPM
        script: |
          xcodebuild -create-xcworkspace -package . -output app.xcworkspace
      - name: Build IPA
        script: |
          xcodebuild build -workspace app.xcworkspace -scheme YourTargetName -sdk iphoneos -configuration Release
    artifacts:
      - build/Release-iphoneos/**/*.ipa
