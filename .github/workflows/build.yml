name: Build real iOS app from SwiftPM
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate temporary Xcode project from SwiftPM
        run: |
          swift package generate-xcodeproj

      - name: Build iOS simulator app with xcodebuild
        run: |
          xcodebuild -project *.xcodeproj -scheme "我的App" -sdk iphonesimulator -configuration Release build

      - name: Locate compiled .app and zip
        run: |
          APP_PATH=$(find build/Release-iphonesimulator -name "我的App.app" -type d)
          zip -r compiled_app.zip "$APP_PATH"

      - name: Upload compiled app
        uses: actions/upload-artifact@v4
        with:
          name: 編譯成品
          path: compiled_app.zip
