name: Just make fake .app
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build empty app bundle
        run: |
          mkdir -p 我的App.app/Contents/MacOS
          echo "fake binary" > 我的App.app/Contents/MacOS/我的App
          cat > 我的App.app/Contents/Info.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
<key>CFBundleExecutable</key>
<string>我的App</string>
<key>CFBundleIdentifier</key>
<string>com.test.myapp</string>
</dict>
</plist>
EOF
      - name: Zip
        run: zip -r 我的App.zip 我的App.app
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 成品下載
          path: 我的App.zip
