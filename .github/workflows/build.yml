name: Build unsigned iOS IPA for Sideloadly
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 由SwiftPM生成Xcode專案
        run: swift package generate-xcodeproj

      - name: Xcodebuild編譯實機arm64，禁止簽名
        run: |
          xcodebuild archive \
          -project *.xcodeproj \
          -scheme "我的App" \
          -destination 'generic/platform=iOS' \
          -archivePath ./build/app.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY=""

      - name: 從xcarchive取出.app，打包Payload，製作IPA
        run: |
          mkdir -p Payload
          cp -r ./build/app.xcarchive/Products/Applications/*.app Payload/
          zip -r MyApp.ipa Payload

      - name: 上傳IPA成品
        uses: actions/upload-artifact@v4
        with:
          name: 未簽名IPA(用Sideloadly簽名安裝)
          path: MyApp.ipa
