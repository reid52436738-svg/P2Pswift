name: Build unsigned iOS IPA for Sideloadly
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build arm64 iOS binary
        run: swift build --triple arm64-apple-ios -Xswiftc "-target" -Xswiftc "arm64-apple-ios17.0"

      - name: Assemble .app and IPA
        run: |
          mkdir -p Payload/MyApp.app
          cp .build/arm64-apple-ios/debug/AppModule Payload/MyApp.app/MyApp
          cp Info.plist Payload/MyApp.app/Info.plist
          zip -r MyApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 未簽名IPA
          path: MyApp.ipa
