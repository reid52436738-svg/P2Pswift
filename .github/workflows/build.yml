name: Build unsigned iOS IPA for Sideloadly
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build arm64 iOS binary
        run: |
          swift build --triple arm64-apple-ios -Xswiftc "-target" -Xswiftc "arm64-apple-ios17.0"

      - name: Assemble .app and IPA
        run: |
          mkdir -p Payload/MyApp.app
          cp .build/arm64-apple-ios/debug/AppModule Payload/MyApp.app/MyApp
          cat > Payload/MyApp.app/Info.plist <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
<key>CFBundleExecutable</key>
<string>MyApp</string>
<key>CFBundleIdentifier</key>
<string>com.test.myapp</string>
<key>CFBundleName</key>
<string>MyApp</string>
<key>CFBundleVersion</key>
<string>1</string>
<key>CFBundleShortVersionString</key>
<string>1.0</string>
</dict>
</plist>
EOF
          zip -r MyApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 未簽名IPA
          path: MyApp.ipa
